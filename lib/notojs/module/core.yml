---
class: HTML
text: |-
  Represents an HTML fragment. Create instances with `html()`; this class has no public constructor.

  When printed, inserts its content into the cell output.

  Throws `TypeError` when printed if this `HTML` object was constructed from `<html>`, `<head>`, `<title>`, or `<body>` elements of `HTMLDocument`.
also:
  - noto:dom

---
class: Image
text: |-
  Represents an image. Create instances with `image()`; this class has no public constructor.

  When printed, inserts an `<img>` element into the cell output with `src` set to the instance `data`.

---
class: Markdown
text: |-
  Represents a Markdown document. Create instances with `markdown()`; this class has no public constructor.

  When printed, inserts a Markdown block containing the instance content into the cell output.

---
class: SVG
text: |-
  Represents an SVG document. Create instances with `icon()` or `image()` using an SVG source;
  this class has no public constructor.

  When printed, inserts an `<svg>` element into the cell output.

---
class: XML
text: |-
  Represents an XML document. Create instances with `xml()`; this class has no public constructor.

  When printed, inserts an XML code block into the cell output.

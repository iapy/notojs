interface: noto::fs::Path
docs: noto::fs::Path
text: |-
  Pointer-like facade for a host-owned JavaScript `Path`.

  ```c++
  JSValue copy(JSContext *ctx, noto::fs::Path source) {
    auto [native, writable] = source->native();
    return noto::fs::Path::make(ctx, noto::fs::Path::n2v(native));
  }
  ```
also:
  - Path
methods:
  native:
    sign:
      - type: std::pair<std::filesystem::path, bool>
        args:
          []
    docs: noto::fs::Path.native
    text: |-
      Returns the native path and whether it is writable.
statics:
  make:
    sign:
      - type: JSValue
        args:
          - JSContext *
          - "std::filesystem::path &&"
    docs: noto::fs::Path.make
    text: |-
      Creates a JavaScript `Path` from an absolute virtual path, or returns a JavaScript exception if it is invalid or unmounted.
  n2v:
    sign:
      - type: std::filesystem::path
        args:
          - "const std::filesystem::path &"
    docs: noto::fs::Path.n2v
    text: |-
      Converts an absolute native path to its mounted virtual path. Throws `std::runtime_error` if it cannot be mapped.
  v2n:
    sign:
      - type: std::filesystem::path
        args:
          - "const std::filesystem::path &"
    docs: noto::fs::Path.v2n
    text: |-
      Converts an absolute virtual path to its native path. Throws `std::runtime_error` if it cannot be mapped.

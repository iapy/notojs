class: HTMLDocument
base: Document
docs: HTMLDocument
text: |-
  Represents an HTML document.
also:
  - https://developer.mozilla.org/en-US/docs/Web/API/HTMLDocument
impl:
  - HTML::Interface
properties:
  _live:
    getter: true
    docs: HTMLDocument._live
    text: |-
      Contains the number of live `HTMLCollection` objects associated with this `HTMLDocument`.
  body:
    getter: true
    docs: HTMLDocument.body
    text: |-
      Contains the document’s `<body>` element.
  documentElement:
    getter: true
    docs: HTMLDocument.documentElement
    text: |-
      Returns the root `HTMLElement` of `this` `HTMLdocument`.
  forms:
    getter: true
    docs: HTMLDocument.forms
    text: |-
      Returns a live collection of the document's `<form>` elements.
  head:
    getter: true
    docs: HTMLDocument.head
    text: |-
      Contains the document’s `<head>` element.
  namespaceURI:
    getter: true
    docs: HTMLDocument.namespaceURI
    text: |-
      Returns the HTML namespace URI.
  title:
    getter: true
    setter:
      - "Null"
      - String
    docs: HTMLDocument.title
    text: |-
      Gets or sets `this` `HTMLDocument` title.

      The title is stored in the document’s `<title>` element. Assigning `null` clears the title.
methods:
  createAttribute:
    args:
      -
        - String
    docs: HTMLDocument.createAttribute
    text: |-
      Creates an attribute with the supplied qualified name.
  createAttributeNS:
    args:
      -
        - "Null"
        - String
      -
        - String
        - String
    docs: HTMLDocument.createAttributeNS
    text: |-
      Creates an attribute with the supplied namespace URI and qualified name.
  createCDATASection:
    args:
      -
        - String
    docs: HTMLDocument.createCDATASection
    text: |-
      Creates a CDATA section containing the supplied text.
  createComment:
    args:
      -
        - String
    docs: HTMLDocument.createComment
    text: |-
      Creates a comment node containing the supplied text.
  createDocumentFragment:
    args:
      -
        []
    docs: HTMLDocument.createDocumentFragment
    text: |-
      Creates an empty document fragment owned by this document.
  createElement:
    args:
      -
        - String
    docs: HTMLDocument.createElement
    text: |-
      Creates and returns a new `HTMLElement` with tag name `arg0`.

      The returned element is not automatically inserted into the document.
  createElementNS:
    args:
      -
        - "Null"
        - String
      -
        - String
        - String
    docs: HTMLDocument.createElementNS
    text: |-
      Creates and returns a new `HTMLElement` with tag name `arg1` in namespace `arg0`.

      The returned element is not automatically inserted into the document.

      Throws `DOMException (NamespaceError)` if `arg0` is unsupported namespace.
  createProcessingInstruction:
    args:
      -
        - String
        - String
    docs: HTMLDocument.createProcessingInstruction
    text: |-
      Creates a processing instruction with the supplied target and data.
  createTextNode:
    args:
      -
        - String
    docs: HTMLDocument.createTextNode
    text: |-
      Creates and returns a new `Text` node containing the specified text.

      The returned node is not automatically inserted into the document.
  getElementById:
    args:
      -
        - String
    docs: HTMLDocument.getElementById
    text: |-
      Returns the first `HTMLElement` whose `id` attribute matches `arg0`.

      Returns `null` if no matching element is found.
  getElementsByClassName:
    args:
      -
        - String
    docs: HTMLDocument.getElementsByClassName
    text: |-
      Returns a *live* `HTMLCollection` containing all elements that have the specified class name `arg0`.
  getElementsByTagName:
    args:
      -
        - String
    docs: HTMLDocument.getElementsByTagName
    text: |-
      Returns a *live* `HTMLCollection` containing all elements whose tag name matches `arg0`.
      If arg0 is `"*"`, a *live* `HTMLCollection` containing all elements are returned.
  getElementsByTagNameNS:
    args:
      -
        - "Null"
        - String
      -
        - String
        - String
    docs: HTMLDocument.getElementsByTagNameNS
    text: |-
      Returns a *live* `HTMLCollection` containing all descendant elements whose namespace and local name match the specified values `arg0` and `arg1` respectively.

      Throws `DOMException (NamespaceError)` if `arg0` is unsupported namespace.
  toJSON:
    args:
      -
        []
    docs: HTMLDocument.toJSON
    text: |-
      Throws `TypeError` `"HTMLDocument cannot be serialized"`.
  toString:
    args:
      -
        []
    docs: HTMLDocument.toString
    text: |-
      Returns the serialized representation of `this` `HTMLDocument`.

text: |-
  `noto:fs` provides sandboxed access to the filesystem.

  ###### Exports
  - `mounts`
  - `function path`
  - `class Path`
  - `class FileSystemError`
also:
  - topic:fs
---
exception: FileSystemError
docs: FileSystemError
text: |-
  Represents an error reported by a filesystem operation.

  `FileSystemError` extends `Error`. Its `code` property contains the platform error code and its `message` property contains the corresponding system error message.
---
class: Path
docs: Path
text: |-
  `Path` represents a path in the virtual filesystem. Instances are created with the exported `path()` function; `Path` cannot be constructed directly.

  The virtual filesystem is defined in the main configuration file as a set of path mappings.
  Each entry maps a virtual path to a real filesystem path with access mode:
  - `ro` — read-only (default)
  - `rw` — read-write

  Example:
  ```
  [module:fs]
  /     = /root/path
  /tmp  = /some/real/path,rw
  ```
impl:
  - fs::IPath
defs:
  - type: Absolute
    base: String
    docs: Path.Absolute
    text: |-
      A string containing an absolute, lexically normalized virtual path below a configured mount point.

      Relative paths and paths outside all configured mounts are rejected.
  - struct: CopyOptions
    fields:
      overwrite:
        type: Boolean
        docs: Path.CopyOptions.overwrite
        text: |-
          If `true`, an existing target is overwritten. Defaults to `false`, which causes `FileSystemError` when the target already exists.
    docs: Path.CopyOptions
    text: |-
      Options accepted as the second argument to `Path.copy()`.
  - struct: DirectoryOptions
    fields:
      recursive:
        type: Boolean
        docs: Path.DirectoryOptions.recursive
        text: |-
          If `true`, creates missing parent directories or removes the complete directory tree. Defaults to `false`.
    docs: Path.DirectoryOptions
    text: |-
      Options accepted by `Path.mkdir()` and `Path.remove()`.
  - struct: WriteOptions
    fields:
      append:
        type: Boolean
        docs: Path.WriteOptions.append
        text: |-
          If `true`, appends to the file instead of replacing its contents. Defaults to `false`.
    docs: Path.WriteOptions
    text: |-
      Options accepted as the second argument to `Path.write()`.
properties:
  exists:
    getter: true
    docs: Path.exists
    text: |-
      `true` if the path currently identifies an existing filesystem entry; otherwise `false`.

      Throws `FileSystemError` if the status cannot be read.
  extension:
    getter: true
    docs: Path.extension
    text: |-
      The extension component of the virtual path, including the leading dot, or an empty string if there is no extension.
  filename:
    getter: true
    docs: Path.filename
    text: |-
      The final filename component of the virtual path.
  is_directory:
    getter: true
    docs: Path.is_directory
    text: |-
      `true` if the path identifies a directory; otherwise `false`.

      Throws `FileSystemError` if the status cannot be read.
  is_fifo:
    getter: true
    docs: Path.is_fifo
    text: |-
      `true` if the path identifies a FIFO or named pipe; otherwise `false`.

      Throws `FileSystemError` if the status cannot be read.
  is_regular_file:
    getter: true
    docs: Path.is_regular_file
    text: |-
      `true` if the path identifies a regular file; otherwise `false`.

      Throws `FileSystemError` if the status cannot be read.
  is_socket:
    getter: true
    docs: Path.is_socket
    text: |-
      `true` if the path identifies a filesystem socket; otherwise `false`.

      Throws `FileSystemError` if the status cannot be read.
  is_symlink:
    getter: true
    docs: Path.is_symlink
    text: |-
      `true` if the path identifies a symbolic link; otherwise `false`.

      Throws `FileSystemError` if the status cannot be read.
  native:
    getter: true
    docs: Path.native
    text: |-
      The resolved native filesystem path corresponding to this virtual path.
  parent:
    getter: true
    docs: Path.parent
    text: |-
      A `Path` identifying this path's parent directory.

      Throws `TypeError` if the parent is outside all configured mount points.
  size:
    getter: true
    docs: Path.size
    text: |-
      The size of the referenced regular file in bytes.

      Throws `FileSystemError` if the size cannot be determined, including when the path does not identify a regular file.
methods:
  "[Symbol.iterator]":
    args:
      -
        []
    docs: Path.[Symbol.iterator]
    text: |-
      Returns an iterator yielding a `Path` for each entry in the directory. Entry order is filesystem-dependent.

      Throws `FileSystemError` if the directory cannot be opened, including when this path does not identify a directory.
  append:
    args:
      -
        - String
    docs: Path.append
    text: |-
      Returns a new, lexically normalized `Path` formed by appending `arg0` to this path.

      Throws `TypeError` if the resulting path is outside all configured mount points.
  blob:
    args:
      -
        []
      -
        - String
    docs: Path.blob
    text: |-
      Returns a `Promise` resolving to a `Blob` containing the file's bytes. If provided, `arg0` becomes the blob's MIME type; otherwise its type is empty.

      Throws `FileSystemError` if the path does not identify a regular file or its status cannot be read.
  copy:
    args:
      -
        - Path
      -
        - Path
        - Path.CopyOptions
    docs: Path.copy
    text: |-
      Copies this filesystem entry to target `arg0` and returns `undefined`. A read-only source may be copied, but the target mount must be writable.

      If `arg1.overwrite` is not `true`, an existing target causes `FileSystemError`. Other copy failures and attempts to write to a read-only mount also throw `FileSystemError`.
  file:
    args:
      -
        []
      -
        - String
    docs: Path.file
    text: |-
      Returns a `Promise` resolving to a `File` containing the file's bytes, native filename, and last-modified timestamp. If provided, `arg0` becomes the file's MIME type; otherwise its type is empty.

      Throws `FileSystemError` if the path does not identify a regular file or its metadata cannot be read.
  json:
    args:
      -
        []
    docs: Path.json
    text: |-
      Returns a `Promise` resolving to the file contents parsed as JSON.

      Throws `FileSystemError` if the path does not identify a regular file or its status cannot be read. Invalid JSON rejects the promise with `SyntaxError`.
  mkdir:
    args:
      -
        []
      -
        - Path.DirectoryOptions
    docs: Path.mkdir
    text: |-
      Creates the directory and returns `true` when it was created or `false` when it already exists. If `arg0.recursive` is `true`, missing parent directories are created as needed.

      Throws `FileSystemError` on failure or when the path belongs to a read-only mount.
  move:
    args:
      -
        - Path
    docs: Path.move
    text: |-
      Moves or renames this filesystem entry to target `arg0` and returns `undefined`.

      Throws `FileSystemError` on failure or when either the source or target mount is read-only.
  relative:
    args:
      -
        - Path
    docs: Path.relative
    text: |-
      Returns a string representing this virtual path relative to base path `arg0`.

      Throws `FileSystemError` if the relative path cannot be calculated.
  remove:
    args:
      -
        []
      -
        - Path.DirectoryOptions
    docs: Path.remove
    text: |-
      Removes the referenced file or empty directory. Without recursive removal, the method returns `undefined`.

      If `arg0.recursive` is `true`, removes the complete directory tree and returns the number of removed entries.

      Throws `FileSystemError` on failure, when a non-empty directory is removed non-recursively, or when the path belongs to a read-only mount.
  text:
    args:
      -
        []
    docs: Path.text
    text: |-
      Returns a `Promise` resolving to a UTF-8 string containing the file contents.

      Throws `FileSystemError` if the path does not identify a regular file or its status cannot be read.
  toJSON:
    args:
      -
        []
    docs: Path.toJSON
    text: |-
      Returns the normalized virtual path string represented by this object. This value is used by `JSON.stringify()`.
  write:
    args:
      -
        - String
      -
        - IBlob
      -
        - String
        - Path.WriteOptions
      -
        - IBlob
        - Path.WriteOptions
    docs: Path.write
    text: |-
      Writes the string or blob-like value in `arg0` to the file. Existing contents are replaced unless `arg1.append` is `true`.

      Returns a `Promise` resolving to the number of bytes written.

      Throws `FileSystemError` if the path belongs to a read-only mount, identifies an existing non-regular entry, or the file cannot be opened.
---
function: path
args:
  -
    - Path.Absolute
docs: path
text: |-
  Constructs a `Path` from absolute virtual path `arg0`. The path is lexically normalized before use.

  Throws `TypeError` if `arg0` is relative or does not fall below a configured mount point.

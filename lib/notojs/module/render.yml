docs: render
text: |-
  Creates and returns a renderer function. This function is exported as both `render` and the module's default export.

  In the basic form, `arg0` is the renderer name and `arg1` is a callback:

  ```javascript
  import render from 'noto:render';

  const message = render('notojs.Render/example.js', value => ({value}));
  const result = message('Hello');
  ```

  Calling the renderer invokes the callback synchronously with all supplied arguments and wraps its return value in a content record. The record has the following fields:

  - `data` — the callback's return value
  - `type` — the renderer name
  - `sign` — an eight-character lowercase hexadecimal content checksum
  - `view` — present only for a view-specific call

  The callback receives the renderer call's `this` value and arguments. Exceptions propagate unchanged. Promises are not awaited; a promise returned by the callback becomes `data`.

  Each successful call records the renderer name in the current execution context so the corresponding client bundle can be included with serialized output.

  ###### Views

  In the three-argument form, `arg1` may be a `RegExp` and `arg2` is the callback. The returned callable accepts ordinary direct calls and view selection through matching properties:

  ```javascript
  const panel = render(
    'notojs.Render/panel.js',
    /^(compact|wide)$/,
    value => value
  );

  panel({message: 'Default'});
  panel.compact({message: 'Compact'});
  panel.wide({message: 'Wide'});
  ```

  Reading a matching property does not invoke the callback. Calling the returned view function adds the property name as `view` and invokes the callback with `this` set to `undefined`. A direct renderer call forwards its receiver as the callback's `this` value.

  Property matching uses `property.match(arg1)`. Use `^` and `$` anchors to require a complete match. Reading an unmatched string property throws `TypeError`; symbol properties are not treated as views.

  ###### Independent and final blocks

  In place of the `RegExp`, pass `Block` to create repeatable standalone output blocks or `Final` to create an output block after which no more output may be appended:

  ```javascript
  import render, {Block, Final} from 'noto:render';

  const section = render('notojs.Render/section.js', Block, value => value);
  const finish = render('notojs.Render/finish.js', Final, value => value);

  print(section({part: 1}));
  print(section({part: 2}));
  print(finish({complete: true}));
  ```

  `Block` and `Final` results are converted to signed content records when printed rather than when their renderer is called.

  ###### Custom result prototypes

  Prefix any overload with an `Object` to use it as the prototype of generated content records:

  ```javascript
  const prototype = {
    toJSON() {
      return {type: this.type, data: this.data};
    }
  };

  const message = render(
    prototype,
    'notojs.Render/example.js',
    value => value
  );
  ```

  For ordinary and view renderers, the prototype is applied when the renderer is called. For `Block` and `Final`, it is applied to the signed content record when the result is printed, while the deferred result itself remains an instance of `Block` or `Final`.

  Throws `TypeError` for invalid argument types. The three- and four-argument overloads require their mode argument to be a `RegExp`, `Block`, or `Final` marker and require the final argument to be callable.

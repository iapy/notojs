text: |-
  `noto:render` creates renderer functions for custom notebook output.

  A renderer callback produces the data for a signed content record. The renderer name identifies the browser bundle that handles the record when notebook output is displayed.

  ###### Exports
  - `class Block`
  - `class Final`
  - `function render` (also the default export)
---
class: Render
docs: Render
text: |-
  Internal callable wrapper used by renderers that define view properties with a `RegExp`.

  Calling the wrapper directly produces content without a `view`. Reading a matching string property returns another callable wrapper that adds that property name as the content record's `view`. Reading an unmatched property throws `TypeError`.

  `Render` is not exported and cannot be constructed directly; use the `RegExp` overload of `render()`.
ctor:
  args:
    -
      []
  docs: Render.constructor
  text: |-
    `Render` objects cannot be constructed directly. They are created internally by `render()` when a `RegExp` is supplied.
---
class: Block
docs: Block
text: |-
  Marker class for renderer results that print as independent output blocks.

  Pass `Block` to `render()` in place of the view `RegExp`. Calling the resulting renderer returns a `Block` containing the callback result in `data` and the renderer name in `type`. Printing it creates a signed content record in a new output block.

  A `Block` can be printed more than once; each print appends another independent block. `Block` objects cannot be constructed directly.
impl:
  - noto::Print
ctor:
  args:
    -
      []
  docs: Block.constructor
  text: |-
    `Block` objects cannot be constructed directly. Pass `Block` to `render()` to create a renderer that returns them.
---
class: Final
docs: Final
text: |-
  Marker class for a renderer result that must be the final notebook output.

  Pass `Final` to `render()` in place of the view `RegExp`. Calling the resulting renderer returns a `Final` containing the callback result in `data` and the renderer name in `type`. Printing it appends a signed content record in a new output block and prevents any further output from being appended.

  A `Final` should therefore be printed only after all other output. Attempting to print again, or to print another value afterward, throws `TypeError` because the output collection is no longer extensible. `Final` objects cannot be constructed directly.
impl:
  - noto::Print
ctor:
  args:
    -
      []
  docs: Final.constructor
  text: |-
    `Final` objects cannot be constructed directly. Pass `Final` to `render()` to create a renderer that returns them.
